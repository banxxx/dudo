name: dudo
description: "dudo - a Material You reading app by banxxx."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.5.0 <4.0.0'
  flutter: ">=3.27.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # DI
  get_it: ^7.7.0
  injectable: ^2.4.2

  # Database / storage
  drift: ^2.18.0
  sqlite3_flutter_libs: ^0.5.24
  sqlite3: ^2.4.3
  path_provider: ^2.1.3
  path: ^1.9.0
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  shared_preferences: ^2.2.3

  # Network
  dio: ^5.4.3+1
  cookie_jar: ^4.0.8
  dio_cookie_manager: ^3.1.1

  # Navigation
  go_router: ^14.1.2

  # Material 3 / theming
  dynamic_color: ^1.7.0
  google_fonts: ^6.2.1
  material_symbols_icons: ^4.2762.0

  # TTS / audio
  flutter_tts: ^4.0.2
  audio_service: ^0.18.13
  just_audio: ^0.9.38

  # Parsing
  html: ^0.15.4
  xpath_selector: ^3.0.0
  xpath_selector_html_parser: ^3.0.1
  json_path: ^0.7.4

  # E-Books
  epubx: ^4.0.0
  archive: ^3.6.1
  charset_converter: ^2.2.0

  # UI
  cached_network_image: ^3.3.1
  wolt_modal_sheet: ^0.7.0
  flutter_staggered_grid_view: ^0.7.0
  shimmer: ^3.0.0
  flutter_svg: ^2.0.10+1
  scrollable_positioned_list: ^0.3.8
  toastification: ^3.2.0
  lucide_icons_flutter: ^3.1.14+2

  # System / misc
  permission_handler: ^11.3.1
  background_downloader: ^8.5.5
  package_info_plus: ^8.0.0
  device_info_plus: ^10.1.0
  battery_plus: ^6.0.2
  url_launcher: ^6.2.6
  share_plus: ^9.0.0
  file_picker: ^8.0.3

  # Codegen-friendly
  intl: any
  freezed_annotation: ^2.4.1
  json_annotation: ^4.9.0
  logger: ^2.3.0
  collection: ^1.18.0
  rxdart: ^0.27.7
  fl_chart: ^1.2.0
  flutter_animate: ^4.5.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

  # Codegen
  build_runner: ^2.4.11
  drift_dev: ^2.18.0
  riverpod_generator: ^2.4.0
  injectable_generator: ^2.6.1
  freezed: ^2.5.2
  json_serializable: ^6.8.0
  go_router_builder: ^2.7.0
  custom_lint: ^0.6.4
  riverpod_lint: ^2.3.10

flutter:
  uses-material-design: true
  # Set to `true` and use `l10n.yaml` when migrating off the hand-written
  # AppLocalizations map to generated .arb-based code.
  generate: false
  assets:
    - assets/images/
    - assets/sources/

  fonts:
    - family: Noto Sans SC
      fonts:
        - asset: assets/fonts/NotoSansSC/NotoSansSC-Regular.ttf
          weight: 400
        - asset: assets/fonts/NotoSansSC/NotoSansSC-Medium.ttf
          weight: 500
        - asset: assets/fonts/NotoSansSC/NotoSansSC-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/NotoSansSC/NotoSansSC-Bold.ttf
          weight: 700

    - family: Noto Serif SC
      fonts:
        - asset: assets/fonts/NotoSerifSC/NotoSerifSC-Regular.ttf
          weight: 400
        - asset: assets/fonts/NotoSerifSC/NotoSerifSC-Medium.ttf
          weight: 500
        - asset: assets/fonts/NotoSerifSC/NotoSerifSC-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/NotoSerifSC/NotoSerifSC-Bold.ttf
          weight: 700

    - family: Inter
      fonts:
        - asset: assets/fonts/Inter/Inter_28pt-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter/Inter_28pt-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter/Inter_28pt-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter/Inter_28pt-Bold.ttf
          weight: 700
