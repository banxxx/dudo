name: Dudo Mobile Build

on:
  workflow_dispatch:
  push:
    branches:
      - master
    tags:
      - 'v*.*.*'
  pull_request:
    branches:
      - master

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.44.0'
  ANDROID_NDK_VERSION: '29.0.13113456'
  APP_NAME: Dudo

jobs:
  extract-version:
    name: Extract version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.get-version.outputs.version }}
    steps:
      - name: Extract version from ref
        id: get-version
        shell: bash
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            VERSION="${{ github.ref_name }}"
          else
            VERSION="dev-${{ github.run_number }}-${{ github.sha }}"
            VERSION="${VERSION:0:20}"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    needs: extract-version
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK licenses and install NDK
        shell: bash
        run: |
          set +o pipefail
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses
          set -o pipefail
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;${ANDROID_NDK_VERSION}"

      - name: Use official Maven repositories for CI
        shell: bash
        run: |
          # 国内镜像在 GitHub runner 上可能不稳定，CI 中强制替换为官方源。
          sed -i 's|https://maven.aliyun.com/repository/google|https://dl.google.com/dl/android/maven2|g' \
            android/build.gradle.kts android/settings.gradle.kts
          sed -i 's|https://maven.aliyun.com/repository/public|https://repo.maven.apache.org/maven2|g' \
            android/build.gradle.kts android/settings.gradle.kts
          sed -i 's|https://maven.aliyun.com/repository/gradle-plugin|https://plugins.gradle.org/m2|g' \
            android/build.gradle.kts android/settings.gradle.kts
          sed -i 's|https://mirrors.cloud.tencent.com/gradle-plugins|https://plugins.gradle.org/m2|g' \
            android/build.gradle.kts android/settings.gradle.kts

      - name: Flutter dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Build split APKs
        run: |
          flutter build apk --release \
            --split-per-abi \
            --obfuscate \
            --split-debug-info=build/symbols/android

      - name: Rename APKs
        shell: bash
        run: |
          V="${{ needs.extract-version.outputs.version }}"
          OUT="build/app/outputs/flutter-apk"
          mv "$OUT/app-arm64-v8a-release.apk"   "${APP_NAME}_android_arm64-v8a_${V}.apk"
          mv "$OUT/app-armeabi-v7a-release.apk" "${APP_NAME}_android_armeabi-v7a_${V}.apk"
          mv "$OUT/app-x86_64-release.apk"      "${APP_NAME}_android_x86_64_${V}.apk"

      - name: Upload Android APKs
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: ${{ env.APP_NAME }}_android_*_${{ needs.extract-version.outputs.version }}.apk
          if-no-files-found: error

      - name: Package Android debug symbols
        shell: bash
        run: |
          cd build/symbols
          zip -qq -r -9 "../../${APP_NAME}_android_symbols_${{ needs.extract-version.outputs.version }}.zip" android

      - name: Upload Android debug symbols
        uses: actions/upload-artifact@v4
        with:
          name: android-symbols
          path: ${{ env.APP_NAME }}_android_symbols_${{ needs.extract-version.outputs.version }}.zip
          if-no-files-found: error

  build-ios:
    name: Build iOS IPA
    runs-on: macos-latest
    needs: extract-version
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          architecture: x64
          cache: true

      - name: Flutter dependencies
        run: flutter pub get

      - name: Update CocoaPods repositories
        run: pod repo update
        working-directory: ios

      - name: Disable iOS codesigning for CI
        shell: bash
        run: |
          cat >> ios/Flutter/Release.xcconfig <<'EOF'
          CODE_SIGNING_ALLOWED=NO
          CODE_SIGNING_REQUIRED=NO
          CODE_SIGN_IDENTITY=
          EXPANDED_CODE_SIGN_IDENTITY=
          DEVELOPMENT_TEAM=
          PROVISIONING_PROFILE_SPECIFIER=
          EOF

      - name: Build iOS app without codesigning
        run: |
          flutter build ios --release --no-codesign \
            --obfuscate \
            --split-debug-info=build/symbols/ios

      - name: Create unsigned IPA
        shell: bash
        run: |
          cd build/ios/iphoneos
          mkdir -p Payload
          cp -R Runner.app Payload/
          zip -qq -r -9 "${APP_NAME}_ios_${{ needs.extract-version.outputs.version }}.ipa" Payload

      - name: Upload iOS IPA
        uses: actions/upload-artifact@v4
        with:
          name: ios-ipa
          path: build/ios/iphoneos/${{ env.APP_NAME }}_ios_${{ needs.extract-version.outputs.version }}.ipa
          if-no-files-found: error

      - name: Package iOS debug symbols
        shell: bash
        run: |
          cd build/symbols
          zip -qq -r -9 "../../${APP_NAME}_ios_symbols_${{ needs.extract-version.outputs.version }}.zip" ios

      - name: Upload iOS debug symbols
        uses: actions/upload-artifact@v4
        with:
          name: ios-symbols
          path: ${{ env.APP_NAME }}_ios_symbols_${{ needs.extract-version.outputs.version }}.zip
          if-no-files-found: error
