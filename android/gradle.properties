org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
android.experimental.disableTestConfig=true

# Gradle 8.14 cannot run on Java 25, and Android Studio launches Gradle with
# its bundled JBR 25 by default. Pin the daemon to the JDK 21 installed here
# so IDE, CLI and Flutter-tool builds all use a supported runtime.
org.gradle.java.home=C:/Program Files/Java/jdk-21

